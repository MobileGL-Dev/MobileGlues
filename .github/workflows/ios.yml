name: Build MobileGlues for iOS
on: 
   workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build MobileGlues
        run: |
          cd src/main/cpp 
          git clone --depth 1 https://github.com/g-truc/glm.git 3rdparty/glm
          git clone --depth 1 https://github.com/stbrumme/xxhash.git 3rdparty/xxhash
          git clone https://android.googlesource.com/platform/external/perfetto 3rdparty/perfetto
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DSTATICLIB=OFF \
            -DMACOS=ON \
            -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target mobileglues
          codesign -s - build/libmobileglues.dylib

      - name: Upload lib
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-iOS-dylib
          path: src/main/cpp/build/libmobileglues.dylib